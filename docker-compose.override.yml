services:
  # Open WebUI - Diagnostics Team Only (agent-diagnostics-checkout)
  open-webui-diagnostics:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui-diagnostics
    restart: unless-stopped
    depends_on:
      litellm:
        condition: service_started
    environment:
      # Virtual Key do grupo diagnostics_team
      - OPENAI_API_BASE_URL=http://litellm:4000/v1
      - OPENAI_API_KEY=sk-PcXGfrw4vwEolrjvgnxMWA
      - WEBUI_AUTH=true
      - WEBUI_SECRET_KEY=diagnostics-secret-key-change-this
      - WEBUI_NAME=Diagnostics Team Portal
    ports:
      - "8889:8080"  # Porta diferente da principal
    volumes:
      - open_webui_diagnostics_data:/app/backend/data
    networks:
      - litellm-network

volumes:
  open_webui_diagnostics_data:
    driver: local
