services:
  # PostgreSQL - Database for LiteLLM
  postgres:
    image: postgres:16-alpine
    container_name: litellm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-litellm}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - litellm-network

  # PostgreSQL - Database for Langfuse
  langfuse-db:
    image: postgres:15-alpine
    container_name: langfuse-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: langfuse
      POSTGRES_DB: langfuse
    volumes:
      - langfuse_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - litellm-network

  # Langfuse - Observability and Analytics
  langfuse-server:
    image: langfuse/langfuse:2
    container_name: langfuse-server
    restart: unless-stopped
    depends_on:
      langfuse-db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://langfuse:langfuse@langfuse-db:5432/langfuse
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-changeme-secret-key-min-32-chars}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      SALT: ${SALT:-changeme-salt-min-32-chars}
      TELEMETRY_ENABLED: ${TELEMETRY_ENABLED:-false}
    ports:
      - "3000:3000"
    networks:
      - litellm-network

  # LiteLLM Proxy - Main API Gateway
  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: litellm-proxy
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      langfuse-server:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${LITELLM_DB:-litellm}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-1234}
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY:-sk-salt-1234}
      # OpenAI Configuration
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      # Anthropic Configuration
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      # Langfuse Integration
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY}
      LANGFUSE_HOST: http://langfuse-server:3000
      # UI and Admin
      UI_USERNAME: ${UI_USERNAME:-admin}
      UI_PASSWORD: ${UI_PASSWORD:-admin}
      STORE_MODEL_IN_DB: "True"
    volumes:
      - ./litellm/config.yaml:/app/config.yaml
    ports:
      - "4000:4000"
    command: ["--config", "/app/config.yaml", "--port", "4000", "--detailed_debug"]
    networks:
      - litellm-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:4000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # MCP Server - Model Context Protocol Server
  mcp-server:
    build:
      context: ./mcp-server
      dockerfile: Dockerfile
    container_name: mcp-server
    restart: unless-stopped
    ports:
      - "8080:8080"
    networks:
      - litellm-network

  # Permission Middleware - Group-Based Access Control
  auth-middleware:
    build:
      context: ./auth-middleware
      dockerfile: Dockerfile
    container_name: auth-middleware
    restart: unless-stopped
    depends_on:
      litellm:
        condition: service_started
    environment:
      LITELLM_URL: http://litellm:4000
      PORT: ${AUTH_MIDDLEWARE_PORT:-8000}
      # Virtual Keys for groups
      VENDAS_KEY: ${VENDAS_KEY:-}
      GERAL_KEY: ${GERAL_KEY:-}
    ports:
      - "8000:8000"
    networks:
      - litellm-network

  # MCP Adapter - Agent Orchestration Service
  mcp-adapter:
    build:
      context: ./mcp-adapter
      dockerfile: Dockerfile
    container_name: mcp-adapter
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      litellm:
        condition: service_started
      mcp-server:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-litellm}
      LITELLM_URL: http://litellm:4000
      LITELLM_API_KEY: ${LITELLM_MASTER_KEY:-sk-1234}
      MCP_SERVER_COMMAND: docker exec -i mcp-server python /app/server.py
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY}
      LANGFUSE_HOST: http://langfuse-server:3000
      LOG_LEVEL: INFO
    ports:
      - "8001:8001"
    volumes:
      - ./mcp-adapter:/app
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - litellm-network

  # Ollama - Local LLM Runtime
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - litellm-network

  # Open WebUI - ChatGPT-like Interface (Custom with Agents)
  open-webui:
    build:
      context: ./open-webui
      dockerfile: Dockerfile.custom
    container_name: open-webui-custom
    restart: unless-stopped
    depends_on:
      auth-middleware:
        condition: service_started
      mcp-adapter:
        condition: service_started
      ollama:
        condition: service_started
    environment:
      # Connect to auth-middleware
      - OPENAI_API_BASE_URL=http://auth-middleware:8000/v1
      - OPENAI_API_KEY=dummy
      # Connect to Ollama
      - OLLAMA_BASE_URL=http://ollama:11434
      - WEBUI_AUTH=true
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY:-your-secret-key-change-this}
      # Forward user info headers to middleware
      - ENABLE_FORWARD_USER_INFO_HEADERS=true
      - ENABLE_ADMIN_EXPORT=true
      - ENABLE_ADMIN_CHAT_ACCESS=true
    ports:
      - "8888:8080"
    volumes:
      - open_webui_data:/app/backend/data
    networks:
      - litellm-network

volumes:
  postgres_data:
  langfuse_data:
  open_webui_data:
  ollama_data:

networks:
  litellm-network:
    driver: bridge
